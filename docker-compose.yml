version: "3"

services:
  vault:
    image: pkt43/vault:latest
    container_name: vault
    ports:
      - "3123:3000"
    env_file:
      - .env
    restart: always

  redis:
    image: redis:7-alpine
    container_name: novasafe-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

volumes:
  redis-data:

