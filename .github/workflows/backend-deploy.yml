# ═══════════════════════════════════════════════════════════════════════════════
#  NovaSafe Backend — Production Deployment Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Flow:
#    preflight → change-intelligence → deployment-matrix
#         ├─► mobile-api pipeline (if core changed)
#         └─► admin-api pipeline  (if admin-app changed)
#                    └─► mission-complete
#
#  Push: auto-detects which service(s) changed.
#  Manual: Run workflow → optionally force one or both services.

name: NovaSafe Backend Deploy

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/core/**'
      - 'services/admin-app/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'tsconfig.json'
      - '.github/workflows/**'

  workflow_dispatch:
    inputs:
      deploy_mobile_api:
        description: '📱 Force deploy Mobile API (core)'
        type: boolean
        default: false
      deploy_admin_api:
        description: '🛡️  Force deploy Admin API (admin-app)'
        type: boolean
        default: false

jobs:
  # ─── Stage 1: Pre-flight ───────────────────────────────────────────────────
  preflight:
    name: '🚀 Pre-flight checks'
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline banner
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║        NovaSafe Backend — Deployment Pipeline v2             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  Ref      : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "──────────────────────────────────────────────────────────────"

      - name: Validate orchestrator secrets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_USER SSH_HOST SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            else
              echo "  ✓ ${name}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "  ✓ Pre-flight passed"

  # ─── Stage 2: Change intelligence ──────────────────────────────────────────
  change-intelligence:
    name: '🔍 Change intelligence'
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      mobile_api: ${{ steps.resolve.outputs.mobile_api }}
      admin_api: ${{ steps.resolve.outputs.admin_api }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            mobile_api:
              - 'services/core/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - '.github/workflows/**'
            admin_api:
              - 'services/admin-app/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'tsconfig.json'
              - '.github/workflows/**'

      - name: Resolve deployment targets
        id: resolve
        env:
          FILTER_MOBILE: ${{ steps.filter.outputs.mobile_api }}
          FILTER_ADMIN: ${{ steps.filter.outputs.admin_api }}
          FORCE_MOBILE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mobile_api }}
          FORCE_ADMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_admin_api }}
        run: |
          echo "── Scanning commit diff ──"
          mobile="$FILTER_MOBILE"
          admin="$FILTER_ADMIN"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "$FORCE_MOBILE" = "true" ]; then mobile=true; fi
            if [ "$FORCE_ADMIN" = "true" ]; then admin=true; fi
            if [ "$FORCE_MOBILE" != "true" ] && [ "$FORCE_ADMIN" != "true" ]; then
              mobile="$FILTER_MOBILE"
              admin="$FILTER_ADMIN"
            fi
          fi

          echo "mobile_api=$mobile" >> "$GITHUB_OUTPUT"
          echo "admin_api=$admin" >> "$GITHUB_OUTPUT"
          echo ""
          echo "  Mobile API (core)      : $([ "$mobile" = "true" ] && echo "DEPLOY" || echo "skip")"
          echo "  Admin API (admin-app)  : $([ "$admin" = "true" ] && echo "DEPLOY" || echo "skip")"

  # ─── Stage 3: Deployment matrix (plan only) ───────────────────────────────
  deployment-matrix:
    name: '📋 Deployment matrix'
    needs: change-intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Build execution plan
        run: |
          echo ""
          echo "┌────────────────────┬──────────┬─────────────────────────────────────┐"
          echo "│ Service            │ Action   │ Image                               │"
          echo "├────────────────────┼──────────┼─────────────────────────────────────┤"
          if [ "${{ needs.change-intelligence.outputs.mobile_api }}" = "true" ]; then
            echo "│ mobile-api (core)  │ BUILD+DEPLOY │ ghcr.io/.../novasafe-mobile-vault │"
          else
            echo "│ mobile-api (core)  │ SKIP     │ —                                   │"
          fi
          if [ "${{ needs.change-intelligence.outputs.admin_api }}" = "true" ]; then
            echo "│ admin-api          │ BUILD+DEPLOY │ ghcr.io/.../novasafe-admin-api    │"
          else
            echo "│ admin-api          │ SKIP     │ —                                   │"
          fi
          echo "└────────────────────┴──────────┴─────────────────────────────────────┘"
          echo ""
          if [ "${{ needs.change-intelligence.outputs.mobile_api }}" != "true" ] \
          && [ "${{ needs.change-intelligence.outputs.admin_api }}" != "true" ]; then
            echo "::notice::No service targets — pipeline will complete without deploy jobs."
          fi

  # ─── Stage 4a: Mobile API pipeline ─────────────────────────────────────────
  mobile-api:
    name: '📱 Mobile API pipeline'
    needs: [change-intelligence, deployment-matrix]
    if: needs.change-intelligence.outputs.mobile_api == 'true'
    uses: ./.github/workflows/mobile-api-deploy.yml
    secrets: inherit

  # ─── Stage 4b: Admin API pipeline ──────────────────────────────────────────
  admin-api:
    name: '🛡️ Admin API pipeline'
    needs: [change-intelligence, deployment-matrix]
    if: needs.change-intelligence.outputs.admin_api == 'true'
    uses: ./.github/workflows/admin-api-deploy.yml
    secrets: inherit

  # ─── Stage 5: Mission complete ─────────────────────────────────────────────
  mission-complete:
    name: '✅ Mission complete'
    needs: [change-intelligence, mobile-api, admin-api]
    if: |
      always() &&
      !cancelled() &&
      (needs.mobile-api.result == 'success' || needs.mobile-api.result == 'skipped') &&
      (needs.admin-api.result == 'success' || needs.admin-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              NovaSafe Backend — Deploy Summary               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "  Mobile API : ${{ needs.mobile-api.result || 'skipped' }}"
          echo "  Admin API  : ${{ needs.admin-api.result || 'skipped' }}"
          echo "  Status     : SUCCESS"
          echo "──────────────────────────────────────────────────────────────"
