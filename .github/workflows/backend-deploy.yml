# ═══════════════════════════════════════════════════════════════════════════════
#  NovaSafe Backend — Production Deployment Pipeline
# ═══════════════════════════════════════════════════════════════════════════════
#
#  Flow:
#    preflight → change-intelligence → deployment-matrix
#         ├─► mobile-api pipeline (if core changed)
#         └─► admin-api pipeline  (if admin-app changed)
#                    └─► mission-complete
#
#  Push: auto-detects which service(s) changed.
#  Manual: Run workflow → optionally force one or both services.

name: NovaSafe Backend Deploy

on:
  workflow_call:
    secrets:
      SSH_USER:
        required: true
      SSH_HOST:
        required: true
      SSH_PASSWORD:
        required: true
      DEPLOY_PATH:
        required: true
      DEPLOY_REPO_PATH:
        required: false
      SSH_PRIVATE_KEY:
        required: false

jobs:
  # ─── Stage 1: Pre-flight ───────────────────────────────────────────────────
  preflight:
    name: '🚀 Pre-flight checks'
    runs-on: ubuntu-latest
    steps:
      - name: Pipeline banner
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║        NovaSafe Backend — Deployment Pipeline v2             ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "  Trigger  : ${{ github.event_name }}"
          echo "  Ref      : ${{ github.ref_name }}"
          echo "  Commit   : ${{ github.sha }}"
          echo "  Actor    : ${{ github.actor }}"
          echo "──────────────────────────────────────────────────────────────"

      - name: Validate orchestrator secrets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_USER SSH_HOST SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            else
              echo "  ✓ ${name}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1
          echo "  ✓ Pre-flight passed"

  # ─── Stage 2: Change intelligence ──────────────────────────────────────────
  change-intelligence:
    name: '🔍 Change intelligence'
    needs: preflight
    runs-on: ubuntu-latest
    outputs:
      mobile_api: ${{ steps.resolve.outputs.mobile_api }}
      admin_api: ${{ steps.resolve.outputs.admin_api }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve deployment targets
        id: resolve
        env:
          DEPLOY_TARGET: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_target || '' }}
          FORCE_MOBILE: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_mobile_api == true }}
          FORCE_ADMIN: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_admin_api == true }}
        run: |
          set -euo pipefail
          mobile=false
          admin=false

          detect_from_git() {
            local before="$1"
            local changed
            if [ -z "$before" ] || [ "$before" = "0000000000000000000000000000000000000000" ]; then
              changed=$(git diff --name-only HEAD~1 HEAD 2>/dev/null || true)
            else
              changed=$(git diff --name-only "$before" HEAD)
            fi
            echo "── Files in diff ──"
            echo "$changed" | sed '/^$/d' | sed 's/^/  /' || true
            echo ""
            while IFS= read -r file; do
              [ -z "$file" ] && continue
              case "$file" in
                services/core/*) mobile=true ;;
                services/admin-app/*) admin=true ;;
                .github/workflows/ci.yml|.github/workflows/mobile-api-deploy.yml|.github/workflows/mobile-vault-service.yml) mobile=true ;;
                .github/workflows/admin-api-deploy.yml|.github/workflows/admin-app-service.yml) admin=true ;;
              esac
            done <<< "$changed"
          }

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "── Manual deploy target: ${DEPLOY_TARGET:-auto-detect} ──"
            case "${DEPLOY_TARGET}" in
              "admin-api only") admin=true ;;
              "mobile-api only") mobile=true ;;
              "both services") mobile=true; admin=true ;;
              *)
                detect_from_git "HEAD~1"
                if [ "$mobile" != "true" ] && [ "$admin" != "true" ]; then
                  echo "::notice::Auto-detect found no service changes — defaulting to admin-api only for manual run."
                  admin=true
                fi
                ;;
            esac
            # Legacy boolean overrides (if someone still uses them)
            if [ "$FORCE_MOBILE" = "true" ]; then mobile=true; fi
            if [ "$FORCE_ADMIN" = "true" ]; then admin=true; fi
          else
            detect_from_git "${{ github.event.before }}"
          fi

          echo "mobile_api=$mobile" >> "$GITHUB_OUTPUT"
          echo "admin_api=$admin" >> "$GITHUB_OUTPUT"
          echo ""
          echo "  Mobile API (core)      : $([ "$mobile" = "true" ] && echo "DEPLOY" || echo "skip")"
          echo "  Admin API (admin-app)  : $([ "$admin" = "true" ] && echo "DEPLOY" || echo "skip")"

  # ─── Stage 3: Deployment matrix (plan only) ───────────────────────────────
  deployment-matrix:
    name: '📋 Deployment matrix'
    needs: change-intelligence
    runs-on: ubuntu-latest
    steps:
      - name: Build execution plan
        run: |
          echo ""
          echo "┌────────────────────┬──────────┬─────────────────────────────────────┐"
          echo "│ Service            │ Action   │ Image                               │"
          echo "├────────────────────┼──────────┼─────────────────────────────────────┤"
          if [ "${{ needs.change-intelligence.outputs.mobile_api }}" = "true" ]; then
            echo "│ mobile-api (core)  │ BUILD+DEPLOY │ ghcr.io/.../novasafe-mobile-vault │"
          else
            echo "│ mobile-api (core)  │ SKIP     │ —                                   │"
          fi
          if [ "${{ needs.change-intelligence.outputs.admin_api }}" = "true" ]; then
            echo "│ admin-api          │ BUILD+DEPLOY │ ghcr.io/.../novasafe-admin-api    │"
          else
            echo "│ admin-api          │ SKIP     │ —                                   │"
          fi
          echo "└────────────────────┴──────────┴─────────────────────────────────────┘"
          echo ""
          if [ "${{ needs.change-intelligence.outputs.mobile_api }}" != "true" ] \
          && [ "${{ needs.change-intelligence.outputs.admin_api }}" != "true" ]; then
            echo "::notice::No service targets — pipeline will complete without deploy jobs."
          fi

  # ─── Stage 3b: VPS gate (fail fast before Docker builds) ───────────────────
  vps-connectivity-gate:
    name: '🛰️ VPS connectivity gate'
    needs: change-intelligence
    if: |
      needs.change-intelligence.outputs.mobile_api == 'true' ||
      needs.change-intelligence.outputs.admin_api == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Test SSH port 22 reachability
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
        run: |
          HOST="$(printf '%s' "${SSH_HOST}" | tr -d '[:space:]')"
          HOST="${HOST#*@}"
          HOST="${HOST#*://}"
          HOST="${HOST%%/*}"
          if [ -z "$HOST" ]; then
            echo "::error::SSH_HOST secret is empty"
            exit 1
          fi
          echo "Testing TCP port 22 on ${HOST}..."
          if timeout 15 bash -c "echo >/dev/tcp/${HOST}/22" 2>/dev/null; then
            echo "  ✓ Port 22 reachable — safe to build & deploy"
          else
            echo "::error::Cannot reach ${HOST} on port 22 from GitHub Actions."
            echo "::error::Hostinger hPanel → Security → Firewall → allow inbound TCP 22 from 0.0.0.0/0"
            echo "::error::GitHub runners use random cloud IPs; IP allowlists will block deploys."
            exit 1
          fi

  # ─── Stage 4a: Mobile API pipeline ─────────────────────────────────────────
  mobile-api:
    name: '📱 Mobile API pipeline'
    needs: [change-intelligence, deployment-matrix, vps-connectivity-gate]
    if: needs.change-intelligence.outputs.mobile_api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/mobile-api-deploy.yml
    secrets: inherit

  # ─── Stage 4b: Admin API pipeline ──────────────────────────────────────────
  admin-api:
    name: '🛡️ Admin API pipeline'
    needs: [change-intelligence, deployment-matrix, vps-connectivity-gate]
    if: needs.change-intelligence.outputs.admin_api == 'true'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/admin-api-deploy.yml
    secrets: inherit

  # ─── Stage 5: Mission complete ─────────────────────────────────────────────
  mission-complete:
    name: '✅ Mission complete'
    needs: [change-intelligence, mobile-api, admin-api]
    if: |
      always() &&
      !cancelled() &&
      (needs.mobile-api.result == 'success' || needs.mobile-api.result == 'skipped') &&
      (needs.admin-api.result == 'success' || needs.admin-api.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Deployment summary
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              NovaSafe Backend — Deploy Summary               ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "  Mobile API : ${{ needs.mobile-api.result || 'skipped' }}"
          echo "  Admin API  : ${{ needs.admin-api.result || 'skipped' }}"
          echo "  Status     : SUCCESS"
          echo "──────────────────────────────────────────────────────────────"
