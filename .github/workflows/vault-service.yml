# Build and push Backend image, then deploy only the backend service.
# Image: ghcr.io/<org>/novasafe-backend:latest
# Deployment: updates service "backend" in the shared docker-compose at DEPLOY_PATH.

name: Build & Deploy Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/vault/**'
      - 'common/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dynamic tag creation (branch, sha) - disabled for now; using only latest
      # - name: Extract metadata
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ghcr.io/${{ github.repository }}
      #     tags: |
      #       type=ref,event=branch
      #       type=sha,prefix={{branch}}-
      #       type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate SSH secrets
        run: |
          if [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "::error::Missing required secrets. Ensure SSH_USER, SSH_HOST, and SSH_PASSWORD are set in repository/organization secrets."
            exit 1
          fi
          echo "SSH_USER and SSH_HOST are set (SSH_PASSWORD is secret)."

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Backend to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          SERVICE_DIR: platform/backend
          SERVICE_NAME: backend
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} << EOF
            set -e

            echo "======================================="
            echo "🚀 NovaSafe Backend Deployment Started"
            echo "======================================="

            echo "📂 Moving to deployment directory"
            cd ${DEPLOY_PATH}/${SERVICE_DIR}

            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml not found in ${SERVICE_DIR}"
              exit 1
            fi

            echo "🔎 Detecting docker compose command"
            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            echo "🔐 Logging into GHCR"
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            echo "📦 Pulling latest image"
            \$DC pull

            echo "🔄 Recreating container"
            \$DC up -d --remove-orphans

            echo "📊 Container status"
            docker ps --filter name=${SERVICE_NAME}

            echo "📜 Last 50 container logs"
            docker logs --tail 50 vault-backend || true

            echo "🧹 Cleaning unused images"
            docker image prune -f || true

            echo "======================================="
            echo "✅ Backend Deployment Completed"
            echo "======================================="
          EOF
