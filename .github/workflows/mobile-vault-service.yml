# Build and push Mobile API image, deploy via novasafe-deployment.
# Fresh VPS: first deploy auto-runs initial-setup + first-boot on the server.

name: Build & Deploy Mobile API

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-vault-service.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: "━━━ Build metadata ━━━"
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              Mobile API — Build & Push                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "  Repository  : ${{ github.repository }}"
          echo "  Commit      : ${{ github.sha }}"
          echo "  Image       : ghcr.io/novasafe-org/novasafe-mobile-vault:latest"
          echo "──────────────────────────────────────────────────────────────"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Mobile API Docker image (core)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/core/Dockerfile
          push: true
          tags: |
            ghcr.io/novasafe-org/novasafe-mobile-vault:latest
            ghcr.io/novasafe-org/novasafe-mobile-vault:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "━━━ Build complete ━━━"
        run: |
          echo "  OK Image pushed to GHCR"
          echo "  OK Starting remote deploy for mobile-api"

  deploy:
    needs: build
    if: success()
    uses: novasafe-org/novasafe-deployment/.github/workflows/deploy-service.yml@master
    with:
      service: mobile-api
      caller_repo: ${{ github.repository }}
      caller_ref: ${{ github.ref_name }}@${{ github.sha }}
    secrets:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
