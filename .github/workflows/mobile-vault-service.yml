# Build and push Mobile API image (services/core), deploy via novasafe-deployment.
#
# This is the only backend-repo deploy workflow. It deploys mobile-api only —
# not landing, auth, app, or nginx (those deploy from their own repos).
#
# Env/config: set values in /opt/novasafe-deployment/mobile-api/.env on the VPS.
#
# Required secrets: SSH_USER, SSH_HOST, SSH_PASSWORD, DEPLOY_PATH

name: Build & Deploy Mobile API

on:
  push:
    branches:
      - main
      - master

  workflow_dispatch:

jobs:
  validate-secrets:
    runs-on: ubuntu-latest
    steps:
      - name: Validate deploy secrets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          missing=0
          for name in SSH_USER SSH_HOST SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            fi
          done
          if [ "$missing" -eq 1 ]; then
            echo "::error::Add org secrets with access to novasafe-backend, or add repo secrets on novasafe-backend."
            echo "::error::Required: SSH_USER, SSH_HOST, SSH_PASSWORD, DEPLOY_PATH"
            exit 1
          fi
          if ! printf '%s' "${SSH_HOST}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::warning::SSH_HOST is not an IPv4 address — use the Hostinger VPS public IP"
          fi
          echo "  OK All required deploy secrets are set on novasafe-backend"

  build:
    needs: validate-secrets
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: "━━━ Build metadata ━━━"
        run: |
          echo ""
          echo "╔══════════════════════════════════════════════════════════════╗"
          echo "║              Mobile API — Build & Push                       ║"
          echo "╚══════════════════════════════════════════════════════════════╝"
          echo "  Repository  : ${{ github.repository }}"
          echo "  Commit      : ${{ github.sha }}"
          echo "  Image       : ghcr.io/novasafe-org/novasafe-mobile-vault:latest"
          echo "──────────────────────────────────────────────────────────────"

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Mobile API Docker image (core)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/core/Dockerfile
          push: true
          tags: |
            ghcr.io/novasafe-org/novasafe-mobile-vault:latest
            ghcr.io/novasafe-org/novasafe-mobile-vault:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: "━━━ Build complete ━━━"
        run: |
          echo "  OK Image pushed to GHCR"
          echo "  OK Starting remote deploy for mobile-api only"

  deploy:
    needs: build
    if: success()
    uses: novasafe-org/novasafe-deployment/.github/workflows/deploy-service.yml@master
    with:
      service: mobile-api
      caller_repo: ${{ github.repository }}
      caller_ref: ${{ github.ref_name }}@${{ github.sha }}
    secrets:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
