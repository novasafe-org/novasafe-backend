# Build and push Mobile API image (core service), deploy via docker compose on the server.
# Server path: /opt/novasafe/mobile-api/ (compose synced from services/core/deploy/)
# Container name unchanged: novasafe-mobile-vault — nginx → :3124

name: Build & Deploy Mobile API

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/core/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/mobile-vault-service.yml'

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Mobile API Docker image (core)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/core/Dockerfile
          push: true
          tags: ghcr.io/novasafe-org/novasafe-mobile-vault:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Validate SSH secrets
        run: |
          if [ -z "${{ secrets.SSH_USER }}" ] || [ -z "${{ secrets.SSH_HOST }}" ] || [ -z "${{ secrets.SSH_PASSWORD }}" ]; then
            echo "::error::Missing required secrets. Ensure SSH_USER, SSH_HOST, and SSH_PASSWORD are set."
            exit 1
          fi
          echo "SSH_USER and SSH_HOST are set (SSH_PASSWORD is secret)."

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Sync docker-compose and nginx config to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
        run: |
          DEPLOY_DIR="${{ secrets.MOBILE_VAULT_DEPLOY_DIR }}"
          NGINX_CONF_DIR="${{ secrets.MOBILE_VAULT_NGINX_CONF_DIR }}"
          if [ -z "$DEPLOY_DIR" ]; then
            DEPLOY_DIR="/opt/novasafe/mobile-api"
          fi
          if [ -z "$NGINX_CONF_DIR" ]; then
            NGINX_CONF_DIR="/opt/novasafe/infra/nginx/conf.d"
          fi
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p ${DEPLOY_DIR} ${NGINX_CONF_DIR}"
          sshpass -p "${SSH_PASSWORD}" scp -o StrictHostKeyChecking=no \
            services/core/deploy/docker-compose.yml \
            "${SSH_USER}@${SSH_HOST}:${DEPLOY_DIR}/docker-compose.yml"
          sshpass -p "${SSH_PASSWORD}" scp -o StrictHostKeyChecking=no \
            services/core/deploy/nginx/mobile-api.conf \
            "${SSH_USER}@${SSH_HOST}:${NGINX_CONF_DIR}/mobile-api.conf"
          echo "Synced compose → ${DEPLOY_DIR}/docker-compose.yml"
          echo "Synced nginx   → ${NGINX_CONF_DIR}/mobile-api.conf (server .env preserved)"

      - name: Deploy Mobile API via docker compose
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          MOBILE_VAULT_DEPLOY_DIR: ${{ secrets.MOBILE_VAULT_DEPLOY_DIR }}
          MOBILE_VAULT_CONTAINER_NAME: ${{ secrets.MOBILE_VAULT_CONTAINER_NAME }}
        run: |
          DEPLOY_DIR="${MOBILE_VAULT_DEPLOY_DIR:-/opt/novasafe/mobile-api}"
          CONTAINER="${MOBILE_VAULT_CONTAINER_NAME:-novasafe-mobile-vault}"
          SERVICE="mobile_vault"

          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no "${SSH_USER}@${SSH_HOST}" bash -s << EOF
            set -euo pipefail

            DEPLOY_DIR="${DEPLOY_DIR}"
            CONTAINER="${CONTAINER}"
            SERVICE="${SERVICE}"

            echo "============================================="
            echo "NovaSafe Mobile API Deployment (core)"
            echo "Deploy dir: \${DEPLOY_DIR}"
            echo "============================================="

            if [ ! -f "\${DEPLOY_DIR}/docker-compose.yml" ]; then
              echo "docker-compose.yml not found in \${DEPLOY_DIR}"
              exit 1
            fi

            if [ ! -f "\${DEPLOY_DIR}/.env" ]; then
              echo "WARNING: \${DEPLOY_DIR}/.env is missing — container may fail to start."
            fi

            docker network create novasafe-network 2>/dev/null || true
            docker network connect novasafe-network novasafe-nginx 2>/dev/null || true
            docker network connect novasafe-network "\${CONTAINER}" 2>/dev/null || true

            cd "\${DEPLOY_DIR}"

            if docker compose version >/dev/null 2>&1; then
              DC="docker compose"
            else
              DC="docker-compose"
            fi

            echo "Logging into GHCR"
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

            if ! \$DC config --services | grep -Fxq "\${SERVICE}"; then
              echo "Service '\${SERVICE}' not found in docker-compose.yml"
              \$DC config --services || true
              exit 1
            fi

            echo "Pulling image"
            \$DC pull "\${SERVICE}"

            echo "Starting container (docker compose up)"
            \$DC up -d --force-recreate --remove-orphans "\${SERVICE}"

            echo "Waiting for health (up to 90s)"
            for i in \$(seq 1 18); do
              STATUS=\$(docker inspect --format='{{.State.Health.Status}}' "\${CONTAINER}" 2>/dev/null || echo "unknown")
              if [ "\${STATUS}" = "healthy" ]; then
                echo "Container is healthy"
                break
              fi
              if [ "\$i" -eq 18 ]; then
                echo "Health check did not pass in time (status=\${STATUS})"
                docker logs --tail 80 "\${CONTAINER}" || true
                exit 1
              fi
              sleep 5
            done

            echo "Host health probe (127.0.0.1:8085)"
            curl -fsS "http://127.0.0.1:8085/mobile/health" | head -c 200
            echo ""

            NGINX_DIR="/opt/novasafe/infra/nginx"
            if [ ! -f "\${NGINX_DIR}/conf.d/mobile-api.conf" ]; then
              echo "ERROR: \${NGINX_DIR}/conf.d/mobile-api.conf missing after sync"
              exit 1
            fi
            if ! grep -q novasafe-mobile-vault "\${NGINX_DIR}/conf.d/mobile-api.conf"; then
              echo "ERROR: mobile-api.conf must proxy to novasafe-mobile-vault"
              exit 1
            fi

            if docker ps --format '{{.Names}}' | grep -Fxq novasafe-nginx; then
              echo "Reload nginx"
              cd "\${NGINX_DIR}"
              docker compose exec -T nginx nginx -t
              docker compose exec -T nginx nginx -s reload
              echo "Nginx → mobile API probe"
              docker exec novasafe-nginx wget -qO- "http://novasafe-mobile-vault:3124/mobile/health"
              echo ""
              echo "Origin HTTPS probe"
              curl -fsSk "https://127.0.0.1/mobile/health" -H "Host: mobile-api.novasafe.io" | head -c 200
              echo ""
            else
              echo "ERROR: novasafe-nginx is not running"
              exit 1
            fi

            docker ps --filter "name=\${CONTAINER}"
            docker logs --tail 30 "\${CONTAINER}" || true
            docker image prune -f || true

            echo "============================================="
            echo "Mobile API deployment completed"
            echo "============================================="
          EOF
