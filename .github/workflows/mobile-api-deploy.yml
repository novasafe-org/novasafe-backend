# Reusable — Mobile API (services/core) build & deploy pipeline.
# Invoked by backend-deploy.yml when core paths change.

name: Mobile API Deploy

on:
  workflow_call:
    secrets:
      SSH_USER:
        required: true
      SSH_HOST:
        required: true
      SSH_PASSWORD:
        required: true
      DEPLOY_PATH:
        required: true
      DEPLOY_REPO_PATH:
        required: false
      SSH_PRIVATE_KEY:
        required: false

jobs:
  validate-credentials:
    name: '🔐 Validate credentials'
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          echo "── Mobile API credential gate ──"
          missing=0
          for name in SSH_USER SSH_HOST SSH_PASSWORD DEPLOY_PATH; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Missing secret: ${name}"
              missing=1
            else
              echo "  ✓ ${name}"
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

  prepare-build-environment:
    name: '⚙️  Prepare build environment'
    needs: validate-credentials
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Environment manifest
        run: |
          echo "── Build environment ──"
          echo "  Service    : mobile-api (core)"
          echo "  Dockerfile : services/core/Dockerfile"
          echo "  Registry   : ghcr.io/novasafe-org/novasafe-mobile-vault"
          echo "  Commit     : ${{ github.sha }}"
      - uses: docker/setup-buildx-action@v3

  compile-container-image:
    name: '🐳 Compile container image'
    needs: prepare-build-environment
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - id: version
        uses: novasafe-org/novasafe-deployment/.github/actions/resolve-version@master
        with:
          package-json: services/core/package.json
          repository-name: novasafe-mobile-api
      - uses: docker/setup-buildx-action@v3
      - name: Build image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/core/Dockerfile
          load: true
          tags: novasafe-mobile-vault:scan
          push: false
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ steps.version.outputs.build }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            RELEASED_AT=${{ steps.version.outputs.released_at }}
            GIT_BRANCH=${{ github.ref_name }}
            REPOSITORY=novasafe-mobile-api
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novasafe-mobile-vault:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/core/Dockerfile
          push: true
          build-args: |
            APP_VERSION=${{ steps.version.outputs.version }}
            BUILD_NUMBER=${{ steps.version.outputs.build }}
            GIT_COMMIT=${{ steps.version.outputs.commit }}
            RELEASED_AT=${{ steps.version.outputs.released_at }}
            GIT_BRANCH=${{ github.ref_name }}
            REPOSITORY=novasafe-mobile-api
          tags: |
            ghcr.io/novasafe-org/novasafe-mobile-vault:latest
            ghcr.io/novasafe-org/novasafe-mobile-vault:${{ github.sha }}
            ghcr.io/novasafe-org/novasafe-mobile-vault:${{ steps.version.outputs.version_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-to-registry:
    name: '📦 Publish to registry'
    needs: compile-container-image
    runs-on: ubuntu-latest
    steps:
      - name: Registry confirmation
        run: |
          echo "── GHCR publish complete ──"
          echo "  :latest  → ghcr.io/novasafe-org/novasafe-mobile-vault:latest"
          echo "  :sha     → ghcr.io/novasafe-org/novasafe-mobile-vault:${{ github.sha }}"

  provision-production:
    name: '🌐 Provision production'
    needs: publish-to-registry
    uses: novasafe-org/novasafe-deployment/.github/workflows/deploy-service.yml@master
    with:
      service: mobile-api
      caller_repo: ${{ github.repository }}
      caller_ref: ${{ github.ref_name }}@${{ github.sha }}
    secrets:
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
      DEPLOY_REPO_PATH: ${{ secrets.DEPLOY_REPO_PATH }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
