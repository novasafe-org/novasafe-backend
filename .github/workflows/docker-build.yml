name: Build & Deploy Backend

on:
  push:
    branches:
      - master
    paths:
      - 'services/vault/**'
      - 'common/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Backend to Server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_BACKEND || secrets.DEPLOY_PATH }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash << EOF
            set -e

            echo "🚀 Starting backend deployment..."

            cd ${DEPLOY_PATH}
            echo "📁 Current directory: \$(pwd)"

            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml not found"
              exit 1
            fi

            if [ ! -f .env ]; then
              echo "ℹ️ .env not found, creating empty one"
              touch .env
            fi

            echo "🔐 Logging in to GHCR..."
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin || true

            echo "🔍 Detecting Docker Compose..."
            if docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker compose"
              echo "✓ Using docker compose (V2)"
            elif command -v docker-compose >/dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker-compose"
              echo "✓ Using docker-compose (V1)"
            else
              echo "❌ Docker Compose not found"
              exit 1
            fi

            echo "🛑 Stopping backend service..."
            \$DOCKER_COMPOSE_CMD stop backend || true

            echo "🧹 Removing backend container..."
            \$DOCKER_COMPOSE_CMD rm -f backend || true

            echo "🗑 Removing old backend image..."
            docker image rm ghcr.io/${GITHUB_REPO}:latest || true

            echo "⬇️ Pulling fresh backend image..."
            \$DOCKER_COMPOSE_CMD pull backend

            echo "🚀 Starting backend with fresh container..."
            \$DOCKER_COMPOSE_CMD up -d --no-deps backend

            echo "⏳ Waiting for backend to initialize..."
            sleep 10

            echo "📦 Running containers:"
            docker ps

            echo "📄 Backend logs (last 50 lines):"
            docker logs backend --tail 50 || true

            echo "🩺 Health check..."
            curl -f http://localhost:3123/health || echo "⚠️ Health check failed (may still be warming up)"

            echo "✅ Backend deployment completed successfully!"
          EOF
