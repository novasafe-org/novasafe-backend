# Build and push Backend image, then deploy only the backend service.
# Image: ghcr.io/<org>/novasafe-backend:latest
# Deployment: updates service "backend" in the shared docker-compose at DEPLOY_PATH.

name: Build & Deploy Backend

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/vault/**'
      - 'common/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'Dockerfile'
      - '.github/workflows/docker-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Dynamic tag creation (branch, sha) - disabled for now; using only latest
      # - name: Extract metadata
      #   id: meta
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ghcr.io/${{ github.repository }}
      #     tags: |
      #       type=ref,event=branch
      #       type=sha,prefix={{branch}}-
      #       type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: |
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy Backend to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_BACKEND || secrets.DEPLOY_PATH }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          COMPOSE_SERVICE: backend
        run: |
          sshpass -p "${SSH_PASSWORD}" ssh -o StrictHostKeyChecking=no ${SSH_USER}@${SSH_HOST} bash << EOF
            set -e
            echo "🚀 Deploying ${COMPOSE_SERVICE}..."
            cd ${DEPLOY_PATH}
            if [ ! -f docker-compose.yml ]; then
              echo "❌ docker-compose.yml not found in DEPLOY_PATH"
              exit 1
            fi
            if docker compose version >/dev/null 2>&1; then
              DOCKER_COMPOSE_CMD="docker compose"
            else
              DOCKER_COMPOSE_CMD="docker-compose"
            fi
            if ! \$DOCKER_COMPOSE_CMD config --services 2>/dev/null | grep -q "^${COMPOSE_SERVICE}\$"; then
              echo "❌ Service '${COMPOSE_SERVICE}' not found in docker-compose.yml. Ensure the server uses the compose from novasafe-deployment with services: landing, auth, app, backend."
              \$DOCKER_COMPOSE_CMD config --services 2>/dev/null || true
              exit 1
            fi
            [ -f .env ] || touch .env
            echo "${GITHUB_TOKEN}" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin || true
            \$DOCKER_COMPOSE_CMD stop ${COMPOSE_SERVICE} || true
            \$DOCKER_COMPOSE_CMD rm -f ${COMPOSE_SERVICE} || true
            docker image rm ghcr.io/${GITHUB_REPO}:latest || true
            \$DOCKER_COMPOSE_CMD pull ${COMPOSE_SERVICE}
            \$DOCKER_COMPOSE_CMD up -d --no-deps ${COMPOSE_SERVICE}
            echo "⏳ Waiting for backend to initialize..."
            sleep 10
            echo "✅ ${COMPOSE_SERVICE} deployment completed!"
            docker ps --filter name=${COMPOSE_SERVICE}
            docker logs \$(docker ps -q -f name=vault-backend) --tail 30 || true
            curl -f http://localhost:5001/health || echo "⚠️ Health check failed (may still be warming up)"
          EOF
