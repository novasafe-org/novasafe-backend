# Deploy admin-api to AWS Lambda
#
# Prerequisites:
#   1. AdminApi CDK stack deployed (novasafe-deployment → Deploy Infrastructure → AdminApi)
#   2. Repository Variables: AWS_ROLE_ARN, AWS_REGION, BACKEND_CONFIG_BUCKET
#   3. S3 object s3://$BACKEND_CONFIG_BUCKET/admin-api/.env uploaded (see docs/DEPLOY_AWS_LAMBDA.md)
#   4. ACM DNS validation + Cloudflare CNAME for admin-api.novasafe.io
#
# See docs/DEPLOY_AWS_LAMBDA.md

name: Deploy AWS (admin-api)

on:
  workflow_dispatch:

jobs:
  build:
    uses: novasafe-org/novasafe-deployment/.github/workflows/build-backend.yml@master
    with:
      service: admin-app
      application-name: novasafe-admin-api
      s3-env-key: admin-api/.env
      overrides-env-path: infra-aws/config/env/admin-api.lambda.overrides.example

  deploy:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: novasafe-org/novasafe-deployment/.github/workflows/deploy-backend-aws.yml@master
    with:
      application-name: novasafe-admin-api
      lambda-function-name: novasafe-prod-fn-admin-api
      artifact-name: lambda-novasafe-admin-api-${{ github.run_id }}
