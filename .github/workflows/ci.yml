# Gitleaks → Build → Trivy → deploy (single pipeline)
#
# Push / manual: security gates, then backend-deploy (change-aware mobile-api + admin-api).
# PR / schedule: security scans only.

name: CI

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'services/core/**'
      - 'services/admin-app/**'
      - 'common/feature-flags/**'
      - 'scripts/run-node-tests.mjs'
      - 'scripts/check-feature-flag-catalog.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/mobile-api-deploy.yml'
      - '.github/workflows/admin-api-deploy.yml'
      - '.github/workflows/mobile-vault-service.yml'
      - '.github/workflows/admin-app-service.yml'

  pull_request:
    paths:
      - 'services/core/**'
      - 'services/admin-app/**'
      - 'common/feature-flags/**'
      - 'scripts/run-node-tests.mjs'
      - 'scripts/check-feature-flag-catalog.mjs'
      - '.github/workflows/ci.yml'
      - '.github/workflows/backend-deploy.yml'
      - '.github/workflows/mobile-api-deploy.yml'
      - '.github/workflows/admin-api-deploy.yml'
  schedule:
    - cron: "0 6 * * 1"

  workflow_dispatch:
    inputs:
      deploy_target:
        description: 'What to deploy'
        type: choice
        options:
          - auto-detect
          - admin-api only
          - mobile-api only
          - both services
        default: admin-api only
      deploy_mobile_api:
        description: '(legacy) Force Mobile API'
        type: boolean
        default: false
      deploy_admin_api:
        description: '(legacy) Force Admin API'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  gitleaks:
    name: Gitleaks
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/gitleaks-cli

  feature-flags-unit:
    name: Feature flags (unit)
    needs: gitleaks
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @novasafe/feature-flags run build
      - name: Run catalog + service tests
        run: |
          pnpm --filter core-service test
          pnpm --filter admin-app-service test

  build-core-image:
    name: Build (core image)
    needs: feature-flags-unit
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build core image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/core/Dockerfile
          load: true
          tags: novasafe-core:scan
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image for Trivy
        run: docker save novasafe-core:scan | gzip > core-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: core-image
          path: core-image.tar.gz
          retention-days: 1

  build-admin-image:
    name: Build (admin image)
    needs: feature-flags-unit
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build admin image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./services/admin-app/Dockerfile
          load: true
          tags: novasafe-admin:scan
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Save image for Trivy
        run: docker save novasafe-admin:scan | gzip > admin-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: admin-image
          path: admin-image.tar.gz
          retention-days: 1

  trivy-core-image:
    name: Trivy (core image)
    needs: build-core-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: core-image
      - name: Load image
        run: docker load -i core-image.tar.gz
      - name: Scan core image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novasafe-core:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  trivy-admin-image:
    name: Trivy (admin image)
    needs: build-admin-image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: admin-image
      - name: Load image
        run: docker load -i admin-image.tar.gz
      - name: Scan admin image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: novasafe-admin:scan
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  security-api-smoke:
    name: API security smoke
    needs: gitleaks
    runs-on: ubuntu-latest
    # Temporarily disabled: cache-dependency-path services/core/package-lock.json does not exist (pnpm monorepo uses root pnpm-lock.yaml). Re-enable in a follow-up CI fix.
    if: false
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: services/core/package-lock.json
      - name: Install and start API
        working-directory: services/core
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017/novasafe_security_smoke
          JWT_SECRET: smoke-test-secret-min-32-chars-long
          NODE_ENV: test
          PORT: 8085
        run: |
          npm ci
          npm run build
          nohup node dist/index.js > /tmp/core.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8085/api/v1/health && break
            sleep 2
          done
      - name: Run security smoke
        run: chmod +x scripts/security-api-smoke.sh && ./scripts/security-api-smoke.sh http://127.0.0.1:8085

  deploy:
    name: Deploy
    needs: [trivy-core-image, trivy-admin-image]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/backend-deploy.yml
    secrets: inherit

  release-core:
    name: GitHub Release (mobile-api)
    needs: deploy
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: novasafe-org/novasafe-deployment/.github/workflows/publish-github-release.yml@master
    with:
      package-json: services/core/package.json
      changelog-path: services/core/CHANGELOG.md
      manifest-path: .release-please-manifest.json
      manifest-key: services/core
      tag-prefix: mobile-api-

  release-admin:
    name: GitHub Release (admin-api)
    needs: deploy
    if: github.event_name == 'push'
    permissions:
      contents: write
    uses: novasafe-org/novasafe-deployment/.github/workflows/publish-github-release.yml@master
    with:
      package-json: services/admin-app/package.json
      changelog-path: services/admin-app/CHANGELOG.md
      manifest-path: .release-please-manifest.json
      manifest-key: services/admin-app
      tag-prefix: admin-api-
