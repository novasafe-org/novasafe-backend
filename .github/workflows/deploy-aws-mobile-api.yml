# Deploy mobile-api to AWS Lambda
#
# Prerequisites:
#   1. MobileApi CDK stack deployed (novasafe-deployment → Deploy Infrastructure → MobileApi)
#   2. Repository Variables: AWS_ROLE_ARN, AWS_REGION
#   3. Environment "production" secret MOBILE_API_ENV_FILE — paste full VPS mobile-api/.env contents
#   4. ACM DNS validation + Cloudflare CNAME for mobile-api.novasafe.io
#
# See docs/DEPLOY_AWS_LAMBDA.md

name: Deploy AWS (mobile-api)

on:
  workflow_dispatch:

jobs:
  build:
    uses: novasafe-org/novasafe-deployment/.github/workflows/build-backend.yml@master
    secrets: inherit
    with:
      service: core
      application-name: novasafe-mobile-api
      overrides-env-path: infra-aws/config/env/mobile-api.lambda.overrides.example
      github-environment: production

  deploy:
    needs: build
    permissions:
      id-token: write
      contents: read
    uses: novasafe-org/novasafe-deployment/.github/workflows/deploy-backend-aws.yml@master
    with:
      application-name: novasafe-mobile-api
      lambda-function-name: novasafe-prod-fn-mobile-api
      artifact-name: lambda-novasafe-mobile-api-${{ github.run_id }}
