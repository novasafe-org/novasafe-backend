name: 🚀✨ Deploy to Raspberry Pi via Droplet (Manual Trigger)

on:
  workflow_dispatch:
    inputs:
      service:
        description: "🧩 Name of backend service to deploy (e.g., vault, etc.)"
        required: true
        default: "vault"
      tag:
        description: "🏷️ Docker tag to use (e.g., latest, arm64, dev, prod)"
        required: true
        default: "latest"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📦 Checkout Repository
        uses: actions/checkout@v4

      - name: 🛠️ Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏗️ Build & Push Multi-Architecture Docker Image
        run: |
          set -e
          SERVICE=${{ github.event.inputs.service }}
          TAG=${{ github.event.inputs.tag }}
          IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${SERVICE}:${TAG}

          echo "🚀 Building Docker image for 🧩 $SERVICE"
          echo "🏷️ Using tag: $TAG"
          echo "⚙️ Platforms: linux/amd64 + linux/arm64"

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t $IMAGE \
            -f ./services/${SERVICE}/Dockerfile \
            . --push

          echo "✅🎉 Build complete! Image pushed successfully ➡️ $IMAGE"

      - name: 🚚🐧 Deploy to Raspberry Pi (Vault only)
        uses: appleboy/ssh-action@v1.1.0
        with:
          # host: ${{ secrets.DROPLET_IP }}
          # port: 2222
          # username: pi
          # password: ${{ secrets.PI_PASSWORD }}
          host: ${{ secrets.DROPLET_IP }}
          port: 2222
          username: pi
          password: ${{ secrets.PI_PASSWORD }}
          script_stop: true
          command_timeout: 10m
          use_insecure_cipher: true
          request_pty: true
          script: |
            set -e
            SERVICE=${{ github.event.inputs.service }}
            TAG=${{ github.event.inputs.tag }}
            IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/${SERVICE}:${TAG}

            echo "🔌 Connected to Raspberry Pi 🥧"
            echo "🛑 Stopping only the ${SERVICE} container..."
            sudo docker compose -f /home/pi/docker-compose.yml down ${SERVICE}

            echo "🧹 Cleaning up old images and cache..."
            sudo docker image prune -af

            echo "📥 Pulling latest image for ${SERVICE} 🐳"
            sudo docker pull -q ${IMAGE}

            echo "🚀 Bringing up ${SERVICE} container fresh and shiny!"
            cd /home/pi/
            sudo docker compose -f /home/pi/docker-compose.yml up -d ${SERVICE}

            echo "🎯✅ Deployment completed successfully for ${SERVICE}:${TAG}!"
            echo "🍀 System is now running the latest and greatest build! 🚀✨"